name: API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: npm install
        
      - name: Start application
        run: npm run start:test > app.log 2>&1 &
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          PORT: 3001
          SECRET: test_secret
          
      - name: Wait for application to be ready
        run: npx wait-on http://localhost:3001 -t 30000
        
      - name: Run tests
        run: npm test
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          PORT: 3001
          SECRET: test_secret
      
      - name: Print application logs on failure
        if: failure()
        run: cat app.log || true
        
      - name: Stop application
        if: always()
        run: pkill -f "node index.js" || true